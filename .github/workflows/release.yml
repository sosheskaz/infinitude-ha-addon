---
name: Publish release image

on:  # yamllint disable-line rule:truthy
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z release tag to rebuild and activate
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${PUBLISHED_TAG}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Build and verify image
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      revision: ${{ steps.build-metadata.outputs.revision }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build metadata
        id: build-metadata
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Build and publish image
        env:
          BUILD_DATE: ${{ steps.build-metadata.outputs.build_date }}
          REVISION: ${{ steps.build-metadata.outputs.revision }}
          VERSION: ${{ needs.metadata.outputs.tag }}
        run: docker buildx bake release --push

      - name: Verify published image
        env:
          EXPECTED_REVISION: ${{ steps.build-metadata.outputs.revision }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.tag }}
          IMAGE: ghcr.io/sosheskaz/infinitude-ha-addon:${{ needs.metadata.outputs.tag }}
        run: bash tests/verify-release-image.sh "${IMAGE}" "${EXPECTED_VERSION}" "${EXPECTED_REVISION}"

  activate-experimental:
    name: Propose Experimental activation
    needs:
      - metadata
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
          ref: main

      - name: Install tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        with:
          cache: false

      - name: Activate verified image
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: bash scripts/activate-experimental.sh "${RELEASE_TAG}"

      - name: Create activation pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(channel): activate experimental ${{ needs.metadata.outputs.tag }}"
          title: "chore(channel): activate experimental ${{ needs.metadata.outputs.tag }}"
          body: |
            Activates the verified `${{ needs.metadata.outputs.tag }}` multi-architecture image in the Experimental channel.

            Image revision: `${{ needs.publish.outputs.revision }}`
          branch: activate-experimental-${{ needs.metadata.outputs.tag }}
          delete-branch: true
          base: main
          add-paths: |
            infinitude-experimental/config.yaml
            release-please-config.json
          reviewers: sosheskaz
          assignees: sosheskaz
