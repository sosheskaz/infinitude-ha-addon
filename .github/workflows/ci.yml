---
name: CI

on:  # yamllint disable-line rule:truthy
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        with:
          cache: true

      - name: Run lint checks
        env:
          YAMLLINT_FORMAT: github
          MISE_EXEC_AUTO_INSTALL: "false"
        run: lefthook run pre-commit --all-files

      - name: Run channel lifecycle examples
        env:
          MISE_EXEC_AUTO_INSTALL: "false"
        run: |
          mise exec -- yq --version
          tests/channel-lifecycle.sh

  build:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Install test tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        with:
          cache: true

      - name: Verify s6 service files
        run: |
          test -x docker/rootfs/etc/s6-overlay/s6-rc.d/infinitude/run
          [ "$(cat docker/rootfs/etc/s6-overlay/s6-rc.d/infinitude/type)" = "longrun" ]
          [ ! -s docker/rootfs/etc/s6-overlay/s6-rc.d/infinitude/dependencies.d/base ]
          [ ! -s docker/rootfs/etc/s6-overlay/s6-rc.d/user/contents.d/infinitude ]

      - name: Build image
        env:
          REVISION: ${{ github.sha }}
          VERSION: ci
        run: docker buildx bake ci --load

      - name: Smoke-test image
        env:
          MISE_EXEC_AUTO_INSTALL: "false"
        run: tests/runtime-smoke.sh infinitude-ha-addon:ci
